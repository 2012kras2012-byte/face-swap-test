<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замена лица</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1c1c1e; color: white; font-family: sans-serif; padding: 15px; margin: 0; text-align: center; }
        h2 { margin-bottom: 5px; font-size: 20px;}
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .template-card { background-color: #2c2c2e; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
        .template-card.selected { border: 2px solid #2481cc; }
        .template-card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }
        .template-info { padding: 8px; }
        .template-title { font-size: 12px; font-weight: bold; }
        .action-section { margin-top: 25px; display: none; }
        .upload-btn { background-color: #2481cc; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; }
        #resetBtn { background-color: #e74c3c; color: white; border: none; padding: 10px; font-size: 14px; border-radius: 8px; width: 100%; margin-top: 10px; display: none; cursor: pointer; }
        #payBtn { background-color: #28a745; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; display: none; cursor: pointer; }
        #resultSection { display: none; margin-top: 20px; }
        #resultImage { max-width: 100%; border-radius: 12px; border: 2px solid #28a745; }
        #loader { display: none; margin-top: 20px; font-size: 18px; color: #f1c40f; }
        #hint { font-size: 14px; color: #28a745; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <h2>Выберите стиль</h2>
    <div class="gallery">
        <!-- 1: Девушка с икрой (улица) -->
        <div class="template-card" onclick="selectTemplate(1, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/IMG_20261115_121758_535.jpg?raw=true" alt="Зимняя сказка">
            <div class="template-info"><div class="template-title">Зимняя сказка</div></div>
        </div>
        
        <!-- 2: Девушка с шариками - Photo1 -->
        <div class="template-card" onclick="selectTemplate(2, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo1.JPG?raw=true" alt="Новогодний шар">
            <div class="template-info"><div class="template-title">Новогодний шар</div></div>
        </div>
        
        <!-- 3: Девушка с бенгальским огнем (бокал) - Photo9 -->
        <div class="template-card" onclick="selectTemplate(3, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo9.JPG?raw=true" alt="Новогодняя ночь">
            <div class="template-info"><div class="template-title">Новогодняя ночь</div></div>
        </div>

        <!-- 4: Девушка в красном свитере - Photo8 -->
        <div class="template-card" onclick="selectTemplate(4, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo8.JPG?raw=true" alt="Уютный вечер">
            <div class="template-info"><div class="template-title">Уютный вечер</div></div>
        </div>

        <!-- 5: Телефонная будка - Photo7 -->
        <div class="template-card" onclick="selectTemplate(5, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo7.JPG?raw=true" alt="Красный телефон">
            <div class="template-info"><div class="template-title">Красный телефон</div></div>
        </div>

        <!-- 6: Девушка с козой - Photo4 -->
        <div class="template-card" onclick="selectTemplate(6, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo4.JPG?raw=true" alt="С Новым годом!">
            <div class="template-info"><div class="template-title">Красная машина</div></div>
        </div>

        <!-- 7: 2027 - Photo5 -->
        <div class="template-card" onclick="selectTemplate(7, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo5.JPG?raw=true" alt="2027">
            <div class="template-info"><div class="template-title">2027</div></div>
        </div>

        <!-- 8: Красная машинка - Photo6 -->
        <div class="template-card" onclick="selectTemplate(8, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo6.JPG?raw=true" alt="Красная машинка">
            <div class="template-info"><div class="template-title">С новым годом!</div></div>
        </div>

        <!-- 9: На снегу (красное/черное) - Photo3 -->
        <div class="template-card" onclick="selectTemplate(9, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo3.JPG?raw=true" alt="Красное и черное">
            <div class="template-info"><div class="template-title">Красное чёрное</div></div>
        </div>

        <!-- 10: Розовое платье - Photo2 -->
        <div class="template-card" onclick="selectTemplate(10, this)">
            <img src="https://github.com/2012kras2012-byte/face-swap-test/blob/main/Photo2.JPG?raw=true" alt="Розовый праздник">
            <div class="template-info"><div class="template-title">Розовый праздник</div></div>
        </div>
    </div>

    <div class="action-section" id="actionSection">
        <h3>Шаг 2: Ваше лицо</h3>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <button class="upload-btn" id="uploadBtn">Выбрать фото</button>
        
        <img id="preview" alt="Ваше фото" />
        <button id="resetBtn">Выбрать другое фото</button>
        <button id="payBtn">Сгенерировать</button>
    </div>

    <div id="loader">⏳ Нейросеть работает... Подождите 20-30 секунд.</div>
    <div id="resultSection">
        <h3>Ваш результат:</h3>
        <img id="resultImage" alt="Результат" />
        <div id="hint">Фото также отправлено в чат с ботом!</div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : { showAlert: function(msg) { alert(msg); }, initDataUnsafe: {} };
        
        const API_URL = "https://face-iv2026.waw0.amvera.tech/api/generate";
        
        const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

        let selectedTemplateId = null;
        let compressedBase64 = null;

        window.selectTemplate = function(id, element) {
            selectedTemplateId = id;
            document.querySelectorAll('.template-card').forEach(function(card) {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            
            var actionSection = document.getElementById('actionSection');
            actionSection.style.display = 'block';
            
            document.getElementById('preview').style.display = 'none';
            document.getElementById('payBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('uploadBtn').style.display = 'block';
            document.getElementById('fileInput').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            compressedBase64 = null;
            
            actionSection.scrollIntoView({ behavior: 'smooth' });
        };

        document.getElementById('uploadBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    
                    var max_size = 1024;
                    var width = img.width;
                    var height = img.height;
                    
                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    compressedBase64 = dataUrl.split(',')[1];
                    
                    document.getElementById('preview').src = dataUrl;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('uploadBtn').style.display = 'none'; 
                    document.getElementById('resetBtn').style.display = 'block';
                    document.getElementById('payBtn').style.display = 'block'; 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('payBtn').addEventListener('click', async function() {
            if (!compressedBase64) return;

            document.getElementById('payBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('hint').style.display = 'none';

            try {
                var response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_base64: compressedBase64,
                        template_id: selectedTemplateId,
                        user_id: userId
                    })
                });

                var data = await response.json();
                
                if (data.image_base64) {
                    document.getElementById('resultImage').src = 'data:image/jpeg;base64,' + data.image_base64;
                    document.getElementById('resultSection').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                    
                    if (userId) {
                        document.getElementById('hint').style.display = 'block';
                    }
                } else {
                    tg.showAlert("Ошибка генерации: " + (data.error || "Неизвестная ошибка"));
                    document.getElementById('payBtn').style.display = 'block';
                    document.getElementById('resetBtn').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                }
            } catch (e) {
                tg.showAlert("Ошибка сети. Проверьте соединение.");
                document.getElementById('payBtn').style.display = 'block';
                document.getElementById('resetBtn').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
            }
        });
    </script>
</body>
</html>
